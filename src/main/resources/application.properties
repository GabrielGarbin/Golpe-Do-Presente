spring.application.name=A3

# --- Camada 3 (opcional): IA externa -------------------------------------
# Desligada por padrão: o sistema funciona só com regras + classificador local.
# Para ligar, defina app.ia.habilitada=true e a variável de ambiente ANTHROPIC_API_KEY
# (NUNCA escreva a chave neste arquivo nem a envie para o GitHub).
app.ia.habilitada=false
app.ia.api-key=${ANTHROPIC_API_KEY:}
app.ia.modelo=claude-haiku-5-5
# Peso da IA na nota final quando ela é consultada (0 a 1)
app.ia.peso=0.5
# Proteções de custo
app.ia.limite-por-usuario-dia=10
app.ia.limite-global-dia=200
app.ia.max-caracteres=1000
app.ia.timeout-segundos=10

# --- Consulta de CNPJ da loja (BrasilAPI, gratuita e sem chave) ----------
# Serviço de terceiros, sem garantia de disponibilidade: se falhar, o resultado vem "inconclusivo".
app.cnpj.url=https://brasilapi.com.br/api/cnpj/v1
app.cnpj.timeout-segundos=8
app.cnpj.limite-por-usuario-dia=30
app.cnpj.limite-global-dia=500

server.port=8081