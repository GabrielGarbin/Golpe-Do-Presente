# Perfil "test": banco H2 em memória (modo PostgreSQL), sem tocar no Supabase.
spring.datasource.url=jdbc:h2:mem:a3test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.demo.seed=false
app.ia.habilitada=false

# Autenticação nos testes: segredo fixo, hash barato (rápido) e um admin conhecido
app.jwt.secret=segredo-de-teste-com-mais-de-trinta-e-dois-caracteres
app.jwt.expiracao-minutos=60
app.auth.pbkdf2-iteracoes=1000
app.auth.admins-email=admin@teste.com
app.auth.login-max-falhas=5
app.auth.login-janela-minutos=15
app.cors.origens=http://localhost:5500
