spring.application.name=A3

# --- Banco de dados: Supabase (PostgreSQL) --------------------------------
# A senha NUNCA vai para o código nem para o GitHub. Coloque-a no arquivo .env
# (copie de .env.example) ou em variáveis de ambiente.
spring.config.import=optional:file:.env[.properties]
#
# Local: variáveis SUPABASE_DB_* no backend/.env ou o arquivo backend/config/application.properties
# (os dois estão no .gitignore). Nuvem (Render): variáveis de ambiente do serviço.
# Use a URL do Session pooler (Supabase > Connect > Session pooler) e o usuário
# postgres.dieflaymwtpupagshxyz.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
# As tabelas são criadas pela migração supabase/migrations/*.sql (supabase db push),
# não pelo Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Base colaborativa -----------------------------------------------------
app.denuncias.limite-confirmacao=3
# Insere dados fictícios só quando o banco está vazio. Use false em produção.
app.demo.seed=${APP_DEMO_SEED:true}

# --- Camada 3 (opcional): IA externa -------------------------------------
# Desligada por padrão: o sistema funciona só com regras + classificador local.
# Para ligar, defina app.ia.habilitada=true e a variável de ambiente ANTHROPIC_API_KEY
# (NUNCA escreva a chave neste arquivo nem a envie para o GitHub).
app.ia.habilitada=false
app.ia.api-key=${ANTHROPIC_API_KEY:}
app.ia.modelo=claude-haiku-5-5
# Peso da IA na nota final quando ela é consultada (0 a 1)
app.ia.peso=0.5
# Proteções de custo
app.ia.limite-por-usuario-dia=10
app.ia.limite-global-dia=200
app.ia.max-caracteres=1000
app.ia.timeout-segundos=10

# --- Consulta de CNPJ da loja (BrasilAPI, gratuita e sem chave) ----------
# Serviço de terceiros, sem garantia de disponibilidade: se falhar, o resultado vem "inconclusivo".
app.cnpj.url=https://brasilapi.com.br/api/cnpj/v1
app.cnpj.timeout-segundos=8
app.cnpj.limite-por-usuario-dia=30
app.cnpj.limite-global-dia=500

# A nuvem injeta PORT; localmente continua 8081.
server.port=${PORT:8081}

# --- Front-end separado (pasta /frontend) ---------------------------------
# Origens que podem chamar a API (separadas por vírgula). "*" só no protótipo.
app.cors.origens=${CORS_ORIGENS:*}

# --- Autenticação (JWT) -----------------------------------------------------
# Segredo que assina os tokens: mínimo de 32 caracteres. NUNCA escreva aqui;
# use a variável de ambiente JWT_SECRET. Vazio = segredo aleatório a cada
# execução (só para desenvolvimento: os tokens deixam de valer ao reiniciar).
app.jwt.secret=${JWT_SECRET:}
# Validade de cada token, em minutos
app.jwt.expiracao-minutos=120
# E-mails (separados por vírgula) que entram como ADMIN. Os demais são USUARIO.
app.auth.admins-email=${ADMINS_EMAIL:}
# Custo do hash de senha (PBKDF2). 600000 é a recomendação atual da OWASP.
app.auth.pbkdf2-iteracoes=600000
# Bloqueio de força bruta: falhas de login permitidas por IP+e-mail dentro da janela
app.auth.login-max-falhas=5
app.auth.login-janela-minutos=15

# --- Atrás de proxy (nginx do Docker, balanceador da nuvem) ------------------
# Usa o cabeçalho X-Forwarded-For para descobrir o IP real de quem chamou, mas só
# quando o proxy está em rede interna (o Tomcat ignora o cabeçalho vindo de fora).
# Sem isso, as cotas por IP (IA, CNPJ) e o limite de login veriam um único IP.
server.forward-headers-strategy=native
